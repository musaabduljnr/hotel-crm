services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_crm_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=*
      - JWT_SECRET=change_me_to_a_secure_jwt_secret_in_production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=hotelcrm_db_password
      - DB_NAME=hotel_crm
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: hotel_crm_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=hotelcrm_db_password
      - MYSQL_DATABASE=hotel_crm
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-photelcrm_db_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
